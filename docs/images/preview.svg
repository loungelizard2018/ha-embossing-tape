      <circle r="15" fill="url(#screw)" stroke="#fff" stroke-opacity=".15"/>
      <path d="M-8 0H8M0-8V8" stroke="#000" stroke-width="6" stroke-linecap="round"/>
      <path d="M-8-.6H8M-.6-8V8" stroke="#fff" stroke-opacity=".17" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <g font-family="Arial Narrow,Roboto Condensed,Arial,sans-serif" font-size="64" font-weight="300" letter-spacing="8" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round" paint-order="stroke fill">
    <text x="603" y="171" fill="none" stroke="#000" stroke-width="6" opacity=".75" filter="url(#softPressure)">22.1809954387132</text>
    <text x="602" y="169" fill="none" stroke="#000" stroke-width="4.8" opacity=".96">22.1809954387132</text>
    <text x="598" y="164" fill="none" stroke="#fff" stroke-width="4.1" opacity=".76">22.1809954387132</text>
    <text x="600" y="167" fill="none" stroke="url(#ridge)" stroke-width="2" filter="url(#relief)">22.1809954387132</text>
    <text x="600" y="167" fill="url(#face)" stroke="#e8ebee" stroke-width=".7" opacity=".18">22.1809954387132</text>
    <text x="600.7" y="168" fill="none" stroke="#000" stroke-width=".8" opacity=".82">22.1809954387132</text>
    <text x="599.4" y="166.2" fill="none" stroke="#fff" stroke-width=".55" opacity=".9">22.1809954387132</text>
  </g>
