<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#181a1d"/>
      <stop offset="1" stop-color="#050607"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202225"/>
      <stop offset=".18" stop-color="#121416"/>
      <stop offset=".66" stop-color="#08090a"/>
      <stop offset="1" stop-color="#020303"/>
    </linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#424448" stop-opacity=".32"/>
      <stop offset=".07" stop-color="#111315"/>
      <stop offset=".62" stop-color="#090a0b"/>
      <stop offset=".9" stop-color="#020303"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".25" stop-color="#edf0f2"/>
      <stop offset=".5" stop-color="#aeb2b6"/>
      <stop offset=".74" stop-color="#111315"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
      <stop offset=".45" stop-color="#d9dde0" stop-opacity=".22"/>
      <stop offset=".8" stop-color="#000" stop-opacity=".35"/>
      <stop offset="1" stop-color="#e8ebee" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="screw" cx="32%" cy="25%" r="82%">
      <stop offset="0" stop-color="#666a6e" stop-opacity=".75"/>
      <stop offset=".2" stop-color="#111315"/>
      <stop offset=".7" stop-color="#020303"/>
      <stop offset="1" stop-color="#24272a" stop-opacity=".45"/>
    </radialGradient>
    <filter id="panelShadow" x="-10%" y="-35%" width="120%" height="185%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".85"/>
    </filter>
    <filter id="tapeShadow" x="-10%" y="-35%" width="120%" height="190%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000" flood-opacity=".95"/>
    </filter>
    <filter id="texture" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".08 .32" numOctaves="3" seed="1974" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="grain"><feFuncA type="table" tableValues="0 .17"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="soft-light"/>
    </filter>
    <filter id="softPressure" x="-12%" y="-30%" width="130%" height="165%">
      <feGaussianBlur stdDeviation=".7"/>
    </filter>
    <filter id="relief" x="-12%" y="-30%" width="130%" height="170%">
      <feDropShadow dx="1" dy="1.8" stdDeviation=".7" flood-color="#000" flood-opacity=".75"/>
    </filter>
