  <rect width="1200" height="300" rx="24" fill="url(#background)"/>

  <g filter="url(#panelShadow)">
    <rect x="34" y="63" width="1132" height="174" rx="21" fill="url(#panel)" stroke="#020303" stroke-width="3" filter="url(#texture)"/>
    <rect x="37" y="66" width="1126" height="168" rx="18" fill="none" stroke="#fff" stroke-opacity=".11"/>
  </g>

  <g filter="url(#tapeShadow)">
    <rect x="104" y="88" width="992" height="124" rx="8" fill="url(#tape)" stroke="#010203" stroke-width="3" filter="url(#texture)"/>
    <path d="M115 102 Q600 98 1085 102" fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="10" stroke-linecap="round"/>
    <path d="M112 197 Q600 204 1088 197" fill="none" stroke="#000" stroke-opacity=".58" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g aria-hidden="true">
    <g transform="translate(68 150) rotate(-18)">
